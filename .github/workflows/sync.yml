name: Sync Steam

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/sync.mjs
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
      - name: Commit data
        run: |
          git config user.name "steam-bot"
          git config user.email "steam-bot@users.noreply.github.com"
          git add data/games.json data/profile.json
          git diff --cached --quiet || git commit -m "sync steam $(date -u +%F)"
          git push
